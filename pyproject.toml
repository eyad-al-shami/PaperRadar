[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-tagger"
version = "0.1.0"
description = "Tag ECCV papers by research domain using TypeSafe's Jev model."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pylatexenc>=2.10,<3",
    "scrapy>=2.19,<2.20",
]

[project.scripts]
research-tagger = "research_tagger.cli:main"
research-tagger-web = "research_tagger.web:main"

[tool.setuptools.package-data]
research_tagger = ["static/*", "schema.sql"]

[tool.setuptools.packages.find]
include = ["research_tagger*"]
